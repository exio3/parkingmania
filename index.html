<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>City Parking</title>
<style>
body {
  margin: 0;
  background: #0d0d0d;
  overflow: hidden;
  font-family: Arial, sans-serif;
}
canvas {
  display: block;
}
button {
  font-size: 22px;
  padding: 14px 26px;
  margin: 8px;
  cursor: pointer;
}
.ui {
  position: absolute;
  color: white;
  text-align: center;
}
.hidden { display: none; }
</style>
</head>
<body>

<!-- LEVEL SELECT ONLY -->
<div id="menu" class="ui" style="top:50%;left:50%;transform:translate(-50%,-50%)">
  <h1 style="font-size:56px;margin-bottom:20px">CITY PARKING</h1>
  <div id="levelButtons"></div>
</div>

<canvas id="game" width="1920" height="1080"></canvas>

<script>
/* ================= SETUP ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

let state = "menu";
let levelIndex = 0;
let hits = 0;

/* ================= CITY LEVELS ================= */
const levels = [
  {
    start:{x:200,y:540},
    park:{x:1600,y:520},
    buildings:[
      {x:0,y:0,w:400,h:350},{x:0,y:730,w:400,h:350},
      {x:600,y:0,w:300,h:250},{x:600,y:830,w:300,h:250}
    ],
    walls:[
      {x:500,y:400,w:40,h:280},
      {x:900,y:400,w:40,h:280}
    ]
  }
];

// generate remaining levels with variety
while(levels.length < 20){
  const i = levels.length;
  levels.push({
    start:{x:150,y:200 + (i%4)*200},
    park:{x:1600,y:300 + (i%3)*250},
    buildings:[
      {x:0,y:0,w:450,h:300},
      {x:0,y:780,w:450,h:300},
      {x:700,y:0,w:350,h:260},
      {x:700,y:820,w:350,h:260},
      {x:1200,y:0,w:400,h:320},
      {x:1200,y:760,w:400,h:320}
    ],
    walls:[
      {x:600,y:300,w:40,h:480},
      {x:1000,y:200,w:40,h:520},
      {x:1400,y:350,w:40,h:380}
    ]
  });
}

/* ================= CAR ================= */
let car = {};

function resetCar(){
  const l = levels[levelIndex];
  car = { x:l.start.x, y:l.start.y, a:0, v:0 };
  hits = 0;
}

/* ================= UI ================= */
const levelButtons = document.getElementById("levelButtons");
levels.forEach((_,i)=>{
  const b = document.createElement("button");
  b.textContent = "Level " + (i+1);
  b.onclick = () => startLevel(i);
  levelButtons.appendChild(b);
});

function startLevel(i){
  levelIndex = i;
  resetCar();
  state = "play";
  document.getElementById("menu").classList.add("hidden");
}

function backToMenu(){
  state = "menu";
  document.getElementById("menu").classList.remove("hidden");
}

/* ================= GAME LOGIC ================= */
function update(){
  if(state !== "play") return;

  let accel = 0, turn = 0;
  if(keys.w||keys.ArrowUp) accel = 0.28;
  if(keys.s||keys.ArrowDown) accel = -0.22;
  if(keys.a||keys.ArrowLeft) turn = -0.045;
  if(keys.d||keys.ArrowRight) turn = 0.045;

  car.v += accel;
  car.v *= 0.97;
  car.a += turn;

  car.x += Math.cos(car.a) * car.v;
  car.y += Math.sin(car.a) * car.v;

  const lvl = levels[levelIndex];

  // collisions
  const obstacles = [...lvl.buildings, ...lvl.walls];
  for(const o of obstacles){
    if(car.x < o.x + o.w && car.x + 60 > o.x &&
       car.y < o.y + o.h && car.y + 30 > o.y){
      hits++;
      car.v *= -0.4;
      if(hits >= 3){
        backToMenu();
      }
    }
  }

  // parking
  const p = lvl.park;
  if(car.x > p.x && car.x < p.x+80 &&
     car.y > p.y && car.y < p.y+50 &&
     Math.abs(car.v) < 0.35){
    startLevel(Math.min(levelIndex+1, 19));
  }
}

/* ================= DRAW ================= */
function drawCar(){
  ctx.save();
  ctx.translate(car.x+30, car.y+15);
  ctx.rotate(car.a);

  // body
  ctx.fillStyle="#c00";
  ctx.fillRect(-30,-15,60,30);

  // roof
  ctx.fillStyle="#900";
  ctx.fillRect(-18,-10,36,20);

  // windshield
  ctx.fillStyle="#333";
  ctx.fillRect(6,-8,16,16);

  // tires
  ctx.fillStyle="#111";
  ctx.fillRect(-28,-18,10,6);
  ctx.fillRect(-28,12,10,6);
  ctx.fillRect(18,-18,10,6);
  ctx.fillRect(18,12,10,6);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(state !== "play") return;

  // roads
  ctx.fillStyle="#2a2a2a";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // sidewalks
  ctx.fillStyle="#444";
  levels[levelIndex].buildings.forEach(b=>{
    ctx.fillRect(b.x,b.y,b.w,b.h);
  });

  // obstacles
  ctx.fillStyle="#666";
  levels[levelIndex].walls.forEach(w=>{
    ctx.fillRect(w.x,w.y,w.w,w.h);
  });

  // parking spot
  const p = levels[levelIndex].park;
  ctx.strokeStyle="lime";
  ctx.lineWidth=4;
  ctx.strokeRect(p.x,p.y,80,50);

  drawCar();

  // HUD
  ctx.fillStyle="white";
  ctx.font="26px Arial";
  ctx.fillText("Hits: " + hits + " / 3", 30, 50);

  // tutorial
  if(levelIndex === 0){
    ctx.fillStyle="rgba(0,0,0,0.6)";
    ctx.fillRect(600,60,720,140);
    ctx.fillStyle="white";
    ctx.fillText("W / A / S / D to drive",640,110);
    ctx.fillText("Park inside the green box",640,150);
    ctx.fillText("3 hits = fail",640,190);
  }
}

/* ================= LOOP ================= */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
